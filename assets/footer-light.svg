<text x="76" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#0b2233" letter-spacing="-0.3">Let's build something real.</text>
<text x="76" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#43667c">Open to internships, ML / computer-vision collaborations, IoT and automation work — or a good technical argument.</text>
