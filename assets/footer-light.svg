<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="Open to internships, collaborations and interesting problems">
<defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#b45309"/></linearGradient>
<linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#b45309"/></linearGradient>
<radialGradient id="glow1"><stop offset="0" stop-color="#0891b2" stop-opacity="0.34"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2"><stop offset="0" stop-color="#b45309" stop-opacity="0.34"/><stop offset="1" stop-color="#b45309" stop-opacity="0"/></radialGradient>
<clipPath id="fc"><rect x="0" y="0" width="900" height="150" rx="5"/></clipPath>
