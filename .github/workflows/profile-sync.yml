name: profile sync

# Pulls the real contribution calendar from the GitHub API and rebuilds the
# SVG panels (contribution matrix included). Runs daily, on demand, and
# whenever the generator or its data changes.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**", "data/**", ".github/workflows/profile-sync.yml"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fetch contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python tools/fetch_github.py

      - name: rebuild SVG panels
        run: python tools/build.py

      - name: commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          git diff --staged --quiet || git commit -m "profile: sync contribution data"
          git push
